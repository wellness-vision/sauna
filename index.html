<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sauna</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
model-viewer{width:100vw;height:100vh;background:#fff;--poster-color:#fff}
</style>
</head>
<body>
<model-viewer src="sauna.glb" alt="Modelo 3D de sauna"
 camera-controls interaction-prompt="none"
 shadow-intensity="0.7" shadow-softness="0.8"
 exposure="1" environment-image="neutral"
 camera-orbit="35deg 72deg auto"
 min-field-of-view="20deg" max-field-of-view="55deg">
</model-viewer>
</body>
</html>
